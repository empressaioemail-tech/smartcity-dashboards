name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  # G-95. The accessibility gate. A REQUIRED job of its own rather than a step
  # inside `test`, because it needs a browser and `test` must stay runnable on a
  # bare Node image - that constraint is why src/hidden-rule.test.mjs and
  # src/first-paint.test.mjs both keep their rendered proofs out of the suite.
  #
  # There is NO SKIP PATH. If Chromium is missing, scripts/a11y-scan.mjs exits 2
  # and says so; it never passes because it could not run. `npm ci` alone does
  # not fetch a browser - the devDependency is playwright-core, which downloads
  # nothing on install - so the install step below is what makes this job able to
  # run at all, and removing it turns the job red rather than green.
  #
  # WITHOUT --with-deps, and that is measured rather than preferred. With it, this
  # step ran in 21 seconds once and then HUNG PAST TWENTY MINUTES twice; it shells
  # out to apt-get, which is not something this gate should have on its critical
  # path. GitHub's ubuntu-latest image already carries the shared libraries
  # Chromium needs, so the browser download alone is enough. If a library is ever
  # missing the failure is loud and self-describing: chromium.launch() throws, the
  # scanner exits 2, and its message names `--with-deps` as the fix. A slow
  # correct path that hangs is worse than a fast one that fails legibly.
  #
  # timeout-minutes is the backstop for the same lesson: a hung gate must fail,
  # not burn an hour looking like it is working.
  #
  # G-99 raised it from 20 to 30. The scan matrix doubled - every surface is now
  # measured at the reference viewport AND at a viewport grown until nothing is
  # left outside the clipping box, because axe evaluates nothing outside it and
  # the old single-viewport figure covered 72.5% of this product's rendered text
  # while reporting as a total. The second pass costs one axe run, one contrast
  # sweep and a few resizes per surface rather than a second page load and a
  # second keyboard walk, so the added time is minutes and not a multiple; the
  # headroom is deliberate rather than measured-to-the-edge, because a gate that
  # times out intermittently is a gate people learn to re-run instead of read.
  #
  # THIS JOB IS THE FIGURE OF RECORD. src/a11y-gate.mjs names ubuntu-latest CI as
  # the authoritative environment and every other run prints an INDICATIVE
  # banner, because the same commit measured 0 unresolved nodes on one machine
  # and 88 on another and an environment-dependent number with two answers has no
  # owner. Moving this job to another runner image changes what the conformance
  # report says, so it is a decision rather than a tidy-up.
  #
  # AND IT RECORDS WHICH TREE IT MEASURED (G-101), which is not bookkeeping.
  # On a `pull_request` event actions/checkout checks out the MERGE of the head
  # into the base, and github.sha IS that merge commit - so two runs of one head
  # SHA can measure two different products. That is not hypothetical: G-99's
  # branch carried --sc-ok #2F7A52 while its own CI job measured #2E7750, because
  # a sibling PR raising that token merged into main thirty minutes before the
  # job started. The disagreement that produced was read as an environment
  # difference and theorised about for a day, and the job's log had said
  # "HEAD is now at f00f2ab Merge dfc0ed66 into 0f916d8" the whole time while the
  # gate's own output named the head SHA. The gate now prints both and says which
  # is which, and A11Y_HEAD_SHA is what lets it tell them apart.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright-core install chromium
      - run: npm run test:a11y
        env:
          A11Y_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
