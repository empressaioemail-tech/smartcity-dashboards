<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartCity Dashboards</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #0f1419;
        color: #e8eef4;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      h2 {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 20px 0 8px;
      }
      .lenses {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        margin: 16px 0 24px;
      }
      article,
      .panel {
        border: 1px solid #2a3540;
        border-radius: 8px;
        padding: 12px 14px;
        background: #151c23;
      }
      iframe {
        width: 100%;
        min-height: 420px;
        border: 1px solid #2a3540;
        border-radius: 8px;
        background: #111;
      }
      .meta {
        color: #9aa8b5;
        font-size: 0.9rem;
      }
      .compose {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: end;
        margin: 12px 0 16px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.85rem;
        color: #9aa8b5;
      }
      input {
        background: #0f1419;
        color: #e8eef4;
        border: 1px solid #2a3540;
        border-radius: 6px;
        padding: 8px 10px;
        min-width: 220px;
      }
      button {
        background: #2a6f97;
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 9px 14px;
        cursor: pointer;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: 1.4fr 1fr;
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .status {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #7ad0a5;
      }
      .status.empty,
      .status.unavailable {
        color: #e3b341;
      }
    </style>
  </head>
  <body>
    <h1>City manager</h1>
    <p class="meta">Proof lens over one parcel. SmartSite embed, atom-read from retrieval, files room over HTTP. Honest empty if nothing is there.</p>
    <form id="compose-form" class="compose">
      <label>
        Parcel Node Id
        <input id="parcel-node-id" name="parcelNodeId" placeholder="48021:34137" autocomplete="off" />
      </label>
      <label>
        City key
        <input id="city-key" name="cityKey" value="template-city" autocomplete="off" />
      </label>
      <button type="submit" id="compose-btn">Compose</button>
    </form>
    <div class="grid">
      <section class="panel">
        <h2 id="embed-heading">SmartSite</h2>
        <p id="smartsite-basis" class="meta"></p>
        <iframe id="site" title="SmartSite embed" src="about:blank"></iframe>
      </section>
      <div>
        <section class="panel">
          <h2>Atoms</h2>
          <p id="atoms-status" class="status"></p>
          <p id="atoms-basis" class="meta"></p>
          <p id="atoms-summary" class="meta"></p>
        </section>
        <section class="panel" style="margin-top: 12px">
          <h2>Files room</h2>
          <p id="files-status" class="status"></p>
          <p id="files-basis" class="meta"></p>
          <ul id="files-folders" class="meta"></ul>
        </section>
      </div>
    </div>
    <h2>Lead lenses</h2>
    <div id="lenses" class="lenses"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
